name: CI/CD INCIDE - Develop

on:
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

  # Ejecución automática: Sábados a las 7:00 AM (Hora Local UTC-7)
  schedule:
    # La sintaxis cron es: "minuto hora día_mes mes día_semana"
    - cron: '0 14 * * 6'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          
      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Install dependencies
        run: flutter pub get

      # Agregar aquí un job de 'flutter test' si tienes pruebas unitarias

      - name: Build APK
        run: flutter build apk --release

      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups "testers"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Notify Discord on Success
        if: success()
        uses: rjstone/discord-webhook-notify@v2
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          severity: info
          details: "✅ **Despliegue de Aplicación INCIDE exitoso**\nLa rama `develop` ha sido compilada y la nueva versión está disponible en Firebase App Distribution para el equipo de pruebas."
          avatarUrl: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

      - name: Notify Discord on Failure
        if: failure()
        uses: rjstone/discord-webhook-notify@v2
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          severity: error
          details: "❌ **Falló el despliegue de Aplicación INCIDE**\nLa compilación o el envío a Firebase fallaron. Revisa los logs en GitHub Actions para identificar el error."
          avatarUrl: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
