name: app_cliente
description: "App-Incide Cliente Mobile Application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  intl: ^0.20.1

  # Núcleo de lógica compartido
  incide_core:
    path: ../packages/incide_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/construccion.jpg
    - assets/images/Isotipo_Incide.png
    - assets/images/Logo_Incide.png
    - assets/images/logo_incide.jpeg
    - assets/images/logo_google.png
