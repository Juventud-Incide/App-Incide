name: app_proveedor
description: "App-Incide Proveedor Mobile Application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  intl: ^0.20.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  open_filex: ^4.7.0

  # Núcleo de lógica compartido
  incide_core:
    path: ../packages/incide_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/Isotipo_Incide.png
    - assets/images/Logo_Incide.png
    - assets/images/logo_incide.jpeg
    - assets/images/logo_google.png
